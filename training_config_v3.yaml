# OR-RISK-LLAMA: Configuração de Treinamento v3 (Apple MLX - QLoRA)
model: "mlx-community/Llama-3.2-1B-Instruct-4bit"
train: true
data: "./data/v3"
adapter_path: "./adapters_v3"
iters: 200
batch_size: 1
num_layers: 8
learning_rate: 1.5e-5
steps_per_report: 5
steps_per_eval: 25
save_every: 50
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true
seed: 42
lora_parameters:
  rank: 16
  scale: 32.0
  dropout: 0.0
val_batches: 8
